name: Test B (no default)
description: Put an app on the platform's golden path. Once approved, the PRs are opened for you.
title: "Onboard: <app name>"
labels: [onboarding]
body:
  - type: markdown
    attributes:
      value: |
        Fill this in for the app you want on the platform. When the platform team adds the
        **approved** label, a workflow renders the templates and opens two pull requests: one
        in the app's repository (pipeline caller, Dockerfiles) and one in GitOps-Repo (the
        app's UAT environment). Add the **preview** label first to see what would be generated.
        Names and values here are reviewed by people; nothing runs until the PRs are merged.
  - type: input
    id: app
    attributes:
      label: App name
      description: Lowercase letters, digits and '-' (becomes the image prefix, the namespaces `<app>-uat` … and the GitOps folder `apps/<app>`)
      placeholder: logistics
    validations:
      required: true
  - type: input
    id: repository
    attributes:
      label: GitHub repository
      description: owner/name of the app's repository (it must exist; the platform team needs write access to open the PR)
      placeholder: DEVOPS-CANARY/smart-logistics-app
    validations:
      required: true
  - type: dropdown
    id: backend
    attributes:
      label: Backend
      description: A NestJS service in `backend/` (folder, package.json, scripts `format:check lint typecheck test build`)
      options: [nestjs, none]
    validations:
      required: true
  - type: input
    id: backend_port
    attributes:
      label: Backend port
      value: "3001"
  - type: dropdown
    id: backend_orm
    attributes:
      label: Backend database layer
      description: Decides what the image ships so migrations run from it with plain `node`
      options: [prisma, typeorm, none]
  - type: dropdown
    id: frontend
    attributes:
      label: Frontend
      description: "A Next.js app in `frontend/` with `output: 'standalone'` in its Next config"
      options: [nextjs, none]
    validations:
      required: true
  - type: input
    id: worker
    attributes:
      label: Background worker (name)
      description: A process that runs the backend image with its own command (e.g. a Kafka consumer). Leave empty if none.
      placeholder: notifications
  - type: input
    id: worker_command
    attributes:
      label: Worker command
      value: node dist/worker.js
  - type: dropdown
    id: package_manager
    attributes:
      label: Package manager
      options: [npm, yarn]
    validations:
      required: true
  - type: checkboxes
    id: needs
    attributes:
      label: The app needs
      options:
        - label: PostgreSQL
        - label: Redis
        - label: Kafka
  - type: input
    id: owner
    attributes:
      label: Owner
      description: Team or person responsible for the app, and the required reviewer for production deploys (GitHub handle, or org/team-slug for a team)
    validations:
      required: true
  - type: checkboxes
    id: readiness
    attributes:
      label: Readiness (platform plan §11)
      description: Tick what is already true. Anything unticked is fixed with the developers before the first deploy.
      options:
        - label: Health endpoints for liveness and readiness (A3)
        - label: All configuration from environment variables; optional variables really optional (A5)
        - label: "Stateless across replicas: no in-memory sessions, rate limits or socket rooms (A7)"
        - label: Migrations runnable from the built image with plain `node` (A9, A14)
        - label: No environment-specific `NEXT_PUBLIC_*` values (A2, A17)
        - label: Secrets inventory complete, with an owner per value (A18)
